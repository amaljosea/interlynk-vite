name: Staging | Deploy

on:
  workflow_dispatch

jobs:
  run-npm-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install
      - name: Run Tests
        run: npm test || true

  handle-test-failure:
    runs-on: ubuntu-latest
    needs: run-npm-tests
    if: ${{ failure() }}
    steps:
    - name: Fail the build if tests fail
      run: exit 1

  build-and-deploy:
    runs-on: self-hosted
    needs: run-npm-tests
    if: ${{ success() }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.16.0'

    - name: Install Dependencies
      run: npm install

    - name: Build
      run: npm run build
      env:
        NODE_ENV: development
        VITE_VENDOR_LOGIN_URL: https://staging-api.interlynk.io/login
        VITE_VENDOR_LOGOUT_URL: https://staging-api.interlynk.io/logout
        VITE_USER_LOGIN_URL: https://staging-api.interlynk.io/share_users/login
        VITE_GRAPHQL_API: https://staging-api.interlynk.io/lynkapi
        VITE_REFRESH_TOKEN_URL: https://staging-api.interlynk.io/refresh_token
        VITE_SERVER: https://staging-api.interlynk.io
        VITE_VENDOR_RESET_URL: https://staging-api.interlynk.io/password
        GENERATE_SOURCEMAP: false
        CI: ""
        NODE_OPTIONS: --max_old_space_size=4096 

    - name: List build directory contents
      run: ls -la ./build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Sync directory to S3
      run: aws s3 sync build/ s3://staging.interlynk.io --acl public-read --delete
