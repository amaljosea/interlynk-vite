name: Frontend Tests

on:
  push:
    branches:
      - '**' # Trigger on all branches

jobs:
  tests:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint
