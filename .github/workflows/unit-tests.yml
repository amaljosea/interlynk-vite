name: Frontend Unit Tests

on:
  push:
    branches-ignore:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  unit-tests:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test
