name: CI/CD Pipeline

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16.16.0'

    - name: Install Dependencies
      run: npm install

    - name: Build
      run: npm run build
      env:
        NODE_ENV: development
        REACT_APP_VENDOR_LOGIN_URL: http://api.intelynk.io/login
        REACT_APP_USER_LOGIN_URL: http://api.intelynk.io//share_users/login
        REACT_APP_GRAPHQL_API: http://api.intelynk.io//lynkapi

    - name: List build directory contents
      run: ls -la ./build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Sync directory to S3
      run: aws s3 sync build/ s3://app.intelynk.io --acl public-read
