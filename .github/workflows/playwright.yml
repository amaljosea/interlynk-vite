name: Playwright Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'  # Runs every day at 9 AM IST (3:30 AM UTC)

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest  # Using Linux (Ubuntu)

    # Define environment variables (use secrets for sensitive info)
    env:
      PLAYWRIGHT_TEST_URL: https://staging.interlynk.io/auth
      PLAYWRIGHT_USER_EMAIL: amaljoseami@gmail.com
      PLAYWRIGHT_USER_PASSWORD: LynkRisk@1.0

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: PLAYWRIGHT_JSON_OUTPUT_NAME=results.json npx playwright test --reporter=json,html
      env:
        PLAYWRIGHT_TEST_URL: ${{ env.PLAYWRIGHT_TEST_URL }}
        PLAYWRIGHT_USER_EMAIL: ${{ env.PLAYWRIGHT_USER_EMAIL }}
        PLAYWRIGHT_USER_PASSWORD: ${{ env.PLAYWRIGHT_USER_PASSWORD }}

    # Parse the Playwright JSON report to get pass/failure count
    - name: Get test results
      if: always()  # runs regardless of success or failure
      id: test_results
      run: |
        passed_tests=$(jq '.stats.expected' results.json)
        failed_tests=$(jq '.stats.unexpected' results.json)
        total_tests=$((passed_tests + failed_tests))
        echo "total_tests=$total_tests" >> $GITHUB_ENV
        echo "failed_tests=$failed_tests" >> $GITHUB_ENV
        echo "passed_tests=$passed_tests" >> $GITHUB_ENV

    # Notify Slack on Failure (Scheduled Runs Only)
    - name: Notify Slack on Failure (Scheduled Runs Only)
      if: failure() && github.event_name == 'schedule'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "text": "🚨 E2E Playwright Tests failed! ${{ env.passed_tests }} out of ${{ env.total_tests }} tests passed. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here> to view the logs."
        }' \
        $SLACK_WEBHOOK_URL

    # Notify Slack on Success (Scheduled Runs Only)
    - name: Notify Slack on Success (Scheduled Runs Only)
      if: success() && github.event_name == 'schedule'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{
          "text": "✅ E2E Playwright Tests passed! ${{ env.passed_tests }} out of ${{ env.total_tests }} tests passed. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here> to view the logs."
        }' \
        $SLACK_WEBHOOK_URL

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30