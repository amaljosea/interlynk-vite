name: Playwright Tests

on:
  workflow_dispatch

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest  # Changed to Windows

    # Define environment variables (use secrets for sensitive info)
    env:
      PLAYWRIGHT_TEST_URL: https://staging.interlynk.io/auth
      PLAYWRIGHT_USER_EMAIL: amaljoseami@gmail.com
      PLAYWRIGHT_USER_PASSWORD: LynkRisk@1.0

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        PLAYWRIGHT_TEST_URL: ${{ env.PLAYWRIGHT_TEST_URL }}
        PLAYWRIGHT_USER_EMAIL: ${{ env.PLAYWRIGHT_USER_EMAIL }}
        PLAYWRIGHT_USER_PASSWORD: ${{ env.PLAYWRIGHT_USER_PASSWORD }}

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
