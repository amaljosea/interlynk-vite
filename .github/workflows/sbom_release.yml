name: Release | Build SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  TOOL_NAME: ${{ github.repository }}
  SUPPLIER_NAME: Interlynk
  SUPPLIER_URL: https://interlynk.io
  DEFAULT_TAG: v0.0.1
  PYLYNK_TEMP_DIR: $RUNNER_TEMP/pylynk
  SBOM_TEMP_DIR: $RUNNER_TEMP/sbom
  SBOM_ENV: default
  SBOM_FILE_PATH: $RUNNER_TEMP/sbom/prod-sbom.cdx.json

jobs:
  build-sbom:
    name: Build SBOM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Tag
        id: get_tag
        run: echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.1')" >> $GITHUB_ENV
      
      - name: Setup Node.js
        uses: actions/setup-node@v4 # required for npm sbom uses node 20        

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x" # Specify the Python version needed

      - name: Checkout Python SBOM tool
        run: |
          git clone https://github.com/interlynk-io/pylynk.git ${{ env.PYLYNK_TEMP_DIR }}
          cd ${{ env.PYLYNK_TEMP_DIR }}
          git fetch --tags
          latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          git checkout $latest_tag
          echo "Checked out pylynk at tag: $latest_tag"

      - name: Install Python dependencies
        run: |
          cd ${{ env.PYLYNK_TEMP_DIR }}
          pip install -r requirements.txt

      - name: Generate SBOM
        shell: bash
        run: |
          cd ${{ github.workspace }}
          mkdir -p ${{ env.SBOM_TEMP_DIR}}
          npm version ${{ env.LATEST_TAG }} --no-git-tag-version --allow-same-version
          npm sbom --sbom-type application --package-lock-only --sbom-format cyclonedx > ${{ env.SBOM_FILE_PATH }}          

      - name: Upload SBOM
        run: |
          python3 ${{ env.PYLYNK_TEMP_DIR }}/pylynk.py --verbose upload --prod ${{env.TOOL_NAME}} --env ${{ env.SBOM_ENV }} --sbom ${{ env.SBOM_FILE_PATH }} --token ${{ secrets.INTERLYNK_SECURITY_TOKEN }}
