name: SBOM from Release

on:
  release:
    types:
      - created

jobs:
  build-sbom:
    name: SBOM build and Push to Platform
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3 
        with:
            fetch-depth: 0
      - name: Download syft binary
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Run syft
        run: syft version
      - name: Get Tag
        id: get_tag
        run: echo "tag=$(git describe --tags HEAD)" > $GITHUB_ENV
      - name: Build SBOM
        run: |
          syft --source-name 'lynk-app-dash' --source-version ${{ env.tag }} --exclude ./public -o cyclonedx-json@1.4 --file lynk-app-dash.cdx.json .
      - name: Upload SBOM
        run: |
          python3 /tmp/pylynk.py upload --prod 'lynk-dash-api' --sbom lynk-app-dash.cdx.json --${{ secrets.INTERLYNK_SECURITY_TOKEN }}
