name: Build and Push SBOM to Interlynk

on:
  release:
    types:
      - created

jobs:
  build-sbom:
    name: SBOM build and Push to Platform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3 
        with:
            fetch-depth: 0
      - name: Download syft binary
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Run syft
        run: syft version
      - name: Get Tag
        id: get_tag
        run: echo "tag=$(git describe --tags HEAD)" > $GITHUB_ENV
      - name: Build SBOM
        run: |
          syft --source-name 'lynk-app-dash' --source-version ${{ env.tag }} --exclude ./public -o cyclonedx-json --file lynk-app-dash.cdx.json .
      - name: Upload SBOM
        run: |
          curl -v "https://api.interlynk.io/lynkapi" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJqdGkiOiI1MzcyZmQxOS1hMWVkLTQ5NWMtYTZiZS02MTM2NGUwMTRlZmYiLCJzdWIiOiIyMjZlNjU0Mi05MTcxLTRkMjYtOTA2Yy1iOWJlZWM3NDY0ZDciLCJzY3AiOiJ1c2VyIiwiYXVkIjpudWxsLCJpYXQiOjE2OTcxNTE4MDksImV4cCI6MTY5NzIzODIwOX0.gVieV6dL84oJWQNAVH739JbheOcLQSkeLIgUqjfGmUo" \
            -F 'operations={"query":"mutation uploadSbom($doc: Upload!, $projectId: ID!) { sbomUpload(input: { doc: $doc, projectId: $projectId }) { errors } }","variables":{"doc":null,"projectId":"93d17533-34cd-454a-bfae-8e7aea92f8a6"}}' \
            -F 'map={"0":["variables.doc"]}' \
            -F '0=@"lynk-app-dash.cdx.json";type=application/json'
