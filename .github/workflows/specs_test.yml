name: Test | Specs

on:
  push:
    branches:
      - 'main' # Trigger on all branches

jobs:
  tests:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint