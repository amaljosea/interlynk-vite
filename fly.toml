# fly.toml app configuration file generated for dashboard-app on 2023-05-04T16:13:47-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "dashboard-app"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = 5

[experimental]
  auto_rollback = true

[env]
  PORT = "80"
  PRIMARY_REGION = "sjc"

[[services]]
  protocol = "tcp"
  internal_port = 80
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
    restart_limit = 0
